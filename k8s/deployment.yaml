apiVersion: apps/v1
kind: Deployment
metadata:
  name: anant-web-deployment
  namespace: production
  labels:
    app.kubernetes.io/name: anant-platform
    app.kubernetes.io/component: fullstack-web
    app.kubernetes.io/part-of: anant-spiritual-network
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: anant-web
  template:
    metadata:
      labels:
        app: anant-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: anant-web
          image: ghcr.io/anant/anant-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: anant-secrets
                  key: database-url
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: anant-secrets
                  key: supabase-anon-key
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: anant-secrets
                  key: supabase-service-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anant-secrets
                  key: jwt-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: anant-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
