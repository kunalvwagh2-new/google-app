apiVersion: v1
kind: Service
metadata:
  name: anant-web-service
  namespace: production
  labels:
    app: anant-web
spec:
  type: ClusterIP
  selector:
    app: anant-web
  ports:
    - port: 80
      targetPort: 3000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anant-web-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  tls:
    - hosts:
        - anant.bhakti.org
        - api.anant.bhakti.org
      secretName: anant-tls-cert
  rules:
    - host: anant.bhakti.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anant-web-service
                port:
                  number: 80
