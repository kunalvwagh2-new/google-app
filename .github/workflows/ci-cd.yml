name: Anant CI/CD Pipeline (Web & Mobile)

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DOCKER_REGISTRY: 'ghcr.io'
  IMAGE_NAME: '${{ github.repository }}'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static Analysis, Type Check & Linting
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile Check
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. Security Vulnerability Audit & Container Scan
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Compliance Audit
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high || true

      - name: Initialize Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------------------------
  # 3. Container Build & Web Production Deployment (Cloud Run / AWS ECS / K8s)
  # ---------------------------------------------------------------------------
  build-and-deploy-web:
    name: Build Container & Deploy Web
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Kubernetes Cluster (Rolling Update)
        run: |
          echo "☸️ Applying Kubernetes manifests with HPA Autoscaler..."
          # kubectl set image deployment/anant-web-deployment anant-web=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # kubectl rollout status deployment/anant-web-deployment --timeout=180s

  # ---------------------------------------------------------------------------
  # 4. Mobile Build: Android (Google Play Console Internal Track)
  # ---------------------------------------------------------------------------
  build-mobile-android:
    name: Build Android Bundle (Play Store)
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: startsWith(github.ref, 'refs/heads/release') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Mobile Dependencies
        run: npm ci

      - name: Build Android App Bundle (AAB) with Fastlane
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "🤖 Compiling Anant Android App Bundle (AAB) for Google Play..."
          # cd android && bundle exec fastlane deploy_internal

  # ---------------------------------------------------------------------------
  # 5. Mobile Build: iOS (Apple App Store / TestFlight)
  # ---------------------------------------------------------------------------
  build-mobile-ios:
    name: Build iOS IPA (App Store / TestFlight)
    runs-on: macos-14
    needs: [security-audit]
    if: startsWith(github.ref, 'refs/heads/release')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies & CocoaPods
        run: |
          npm ci
          # cd ios && pod install

      - name: Fastlane Beta Deployment (TestFlight)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
        run: |
          echo "🍎 Packaging Anant iOS Archive for TestFlight & App Store submission..."
          # cd ios && bundle exec fastlane beta
